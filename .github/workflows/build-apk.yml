name: 打签名 APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "版本号名（如 1.0.0）"
        default: "1.0.0"
      version_code:
        description: "版本号（整数，每次升级+1）"
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASS: baozhiqi2026
      KEY_ALIAS: baozhiqi
      BUBBLEWRAP_KEYSTORE_PASSWORD: baozhiqi2026
      BUBBLEWRAP_KEY_PASSWORD: baozhiqi2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装依赖与 Bubblewrap CLI
        run: |
          npm i -g @bubblewrap/cli
          bubblewrap --version || true

      - name: 写 Bubblewrap 配置
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: 建工程、生成密钥、构建签名 APK
        run: |
          set -e
          BUILD="$GITHUB_WORKSPACE/build"
          mkdir -p "$BUILD"
          cd "$BUILD"

          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.lee.baozhiqi",
            "host": "lee202611.github.io",
            "name": "保质期管家",
            "shortName": "保质期管家",
            "startUrl": "/baozhiqi/",
            "themeColor": "#ffffff",
            "navigationColor": "#ffffff",
            "backgroundColor": "#ffffff",
            "display": "standalone",
            "iconUrl": "https://lee202611.github.io/baozhiqi/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "android.keystore", "alias": "baozhiqi" },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 21,
            "targetSdkVersion": 34
          }
          EOF
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('twa-manifest.json'));m.appVersionName='${{ github.event.inputs.version_name }}';m.appVersionCode=parseInt('${{ github.event.inputs.version_code }}')||1;fs.writeFileSync('twa-manifest.json',JSON.stringify(m,null,2));"

          keytool -genkeypair -v -keystore android.keystore -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=Baozhiqi, OU=App, O=Lee, L=Shenzhen, ST=Guangdong, C=CN"

          yes | bubblewrap update --skipVersionUpgrade || true
          bubblewrap build --skipPwaValidation

          echo "---- 产物 ----"
          ls -la "$BUILD"

      - name: 验证签名并生成指纹
        run: |
          cd "$GITHUB_WORKSPACE/build"
          if [ -f app-release-signed.apk ]; then
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)
            "$APKSIGNER" verify --verbose --print-certs app-release-signed.apk || true
            keytool -list -v -keystore android.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASS" | grep SHA256 | head -1 > fingerprint.txt || true
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 保质期管家-签名APK
          path: |
            build/app-release-signed.apk
            build/android.keystore
            build/fingerprint.txt
